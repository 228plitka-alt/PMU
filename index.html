<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2d5a8f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ГеоКалькулятор — мобильный калькулятор фигур</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

  <!-- ===== Шапка с логотипом ===== -->
  <header class="app-header">
    <img class="app-logo" src="images/logo.png" alt="Логотип ГеоКалькулятор">
    <div class="app-brand">
      <h1>ГеоКалькулятор</h1>
      <p>Периметр • Площадь • Объём</p>
    </div>
  </header>

  <main>
    <!-- ===== Выбор фигуры ===== -->
    <p class="section-label">Выберите фигуру</p>
    <div class="figures-grid" id="figuresGrid" role="tablist" aria-label="Выбор геометрической фигуры"></div>

    <!-- ===== Параметры выбранной фигуры ===== -->
    <section class="card" id="paramsCard" aria-live="polite">
      <div class="card-title" id="cardTitle"></div>
      <div id="fieldsContainer"></div>
    </section>

    <!-- ===== Результат ===== -->
    <section class="result-card" id="resultCard" aria-live="polite"></section>

    <!-- ===== Сообщение об ошибке ===== -->
    <div class="error-msg" id="errorMsg" role="alert"></div>

    <!-- ===== Кнопка рассчитать (теперь встроена в страницу) ===== -->
    <div class="action-bar">
      <button class="btn-calc" id="calcBtn" type="button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="#fff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="2"/>
          <path d="M8 7h8M8 11h2M12 11h2M16 11h.5M8 15h2M12 15h2M16 15h.5M8 19h2M12 19h2"/>
        </svg>
        Рассчитать
      </button>
    </div>

    <footer class="app-footer">
      ГеоКалькулятор © — учебный мобильный проект.<br>
      Все расчёты выполняются локально на устройстве.
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
